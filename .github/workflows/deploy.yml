# Сборка сайта и выкладка на GitHub Pages.
#
# Срабатывает на каждый коммит в main — в том числе на тот, который делает
# админка при сохранении. Если сборка падает (например, в JSON остался кривой
# символ), выкладки не происходит и на сайте остаётся прежняя версия.

name: Сборка и выкладка

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Две правки подряд не мешают друг другу: едет последняя.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
