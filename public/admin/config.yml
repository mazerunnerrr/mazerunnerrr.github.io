# Админка сайта: правит те же JSON в content/, которые читает вёрстка.
#
# На localhost вход не нужен — CMS предлагает открыть папку проекта прямо
# с диска. На боевом адресе вход по токену GitHub, и «Сохранить» становится
# коммитом: после него сборка едет на Pages сама.
#
# Имя файла проекта = адрес его страницы, поэтому поле «Адрес» только
# латиницей. Обязательность полей держит эта форма, а не код сайта.

backend:
  name: github
  repo: mazerunnerrr/mazerunnerrr.github.io
  branch: main

media_folder: public/media
public_folder: /media

# Два языка (Илья, 2026-10-19). Русский — основной: его поля в корне файла,
# как и раньше. Английский — в ключе `en` того же файла, вкладкой рядом
# с русским в форме. Пустое английское поле на сайте показывает русское.
# Поля, где язык не важен (адрес, год, картинки, ссылки), копируются
# в английский сами (`i18n: duplicate`).
i18n:
  structure: single_file_default_root
  locales: [ru, en]
  default_locale: ru

collections:
  - name: projects
    label: Проекты
    label_singular: проект
    folder: content/projects
    extension: json
    format: json
    create: true
    i18n: true
    slug: "{{fields.slug}}"
    summary: "{{title}}"
    sortable_fields: [year, title]
    fields:
      - name: title
        label: Название
        widget: string
        i18n: true
        required: [ru]
      - name: slug
        label: Адрес страницы
        widget: string
        i18n: duplicate
        pattern: ["^[a-z0-9-]+$", "Только латиница в нижнем регистре, цифры и дефис"]
        hint: "Станет адресом вида /work/адрес/ и именем файла. Потом не меняется."
      - name: year
        label: Год
        widget: string
        i18n: duplicate
        hint: "Год или диапазон: 2026 или 2025–2026"
      - name: role
        label: Роль
        widget: string
        i18n: true
        required: [ru]
      - name: status
        label: Статус
        widget: select
        i18n: duplicate
        hint: "Выбирается по-русски, на английской версии сайта переводится сам"
        options: ["в работе", "личный проект", "разбор и архитектура", "запущен"]
      # Комната проекта в мире — один экран: видео или скриншоты, под ними суть,
      # цифры и ссылки. Остальные поля — полный кейс на странице проекта, в том
      # порядке, в каком они идут здесь. Пустое поле — раздела нет.
      - name: summary
        label: Суть
        widget: text
        i18n: true
        required: false
        hint: "Комната и страница проекта: 2–3 строки, до ~30 слов — что это и зачем"
      - name: task
        label: Задача
        widget: text
        i18n: true
        required: [ru]
        hint: "Страница проекта, раздел «Задача»: что болело и почему понадобилось решение"
      - name: solution
        label: Решение
        widget: text
        i18n: true
        required: false
        hint: "Страница проекта, раздел «Решение»: как решил и почему именно так"
      - name: result
        label: Итог
        widget: text
        i18n: true
        required: false
        hint: "Страница проекта, раздел «Итог»: что изменилось после запуска"
      - name: facts
        label: Цифры
        widget: list
        i18n: true
        required: false
        hint: "Комната и страница проекта: 2–3 числа с подписью, например «848 МБ» + «памяти на сервере»"
        fields:
          - { name: value, label: Число, widget: string, i18n: true }
          - { name: label, label: Подпись, widget: string, i18n: true }
      - name: scheme
        label: Схема устройства
        widget: image
        i18n: duplicate
        required: false
        hint: "Страница проекта, раздел «Как устроено»: схема картинкой, лучше 1600×1000"
      - name: did
        label: Что сделал
        widget: list
        i18n: true
        required: [ru]
        hint: "3–6 пунктов строго о сделанном. Без «участвовал» и «помогал»"
        summary: "{{fields.title}}"
        fields:
          - { name: title, label: Коротко, widget: string, i18n: true, hint: "До ~8 слов — начало пункта, выделено" }
          - { name: detail, label: Подробно, widget: text, i18n: true, required: false, hint: "Продолжение пункта на странице проекта" }
      - name: stack
        label: Технологии
        widget: list
        i18n: true
        required: [ru]
        hint: "По одной на строку: Python, FastAPI, SQLite"
      - name: video
        label: Видео на обложку
        widget: file
        i18n: duplicate
        required: false
        hint: "Есть видео — оно играет в комнате вместо скриншотов"
      - name: poster
        label: Кадр до видео
        widget: image
        i18n: duplicate
        required: false
        hint: "Стоит на месте видео, пока оно грузится. Тот же размер, что у видео"
      - name: shots
        label: Скриншоты
        widget: list
        i18n: true
        required: false
        hint: "Листаются в комнате, если нет видео; на странице проекта — с подписями. 1600×1000"
        summary: "{{fields.caption}}"
        fields:
          - { name: image, label: Экран, widget: image, i18n: duplicate }
          - { name: caption, label: Подпись, widget: string, i18n: true, required: false, hint: "Что на экране и зачем" }
      - name: links
        label: Ссылки
        widget: list
        i18n: true
        required: false
        fields:
          - { name: label, label: Подпись, widget: string, i18n: true }
          - { name: url, label: Адрес, widget: string, i18n: duplicate }
      - name: accent
        label: Цвет комнаты
        widget: select
        i18n: duplicate
        required: false
        options:
          - { label: "Песочный", value: amber }
          - { label: "Терракота", value: clay }
          - { label: "Пыльно-голубой", value: azure }
          - { label: "Шалфей", value: sage }
        hint: "Им тонируется комната проекта. Пусто — цвет статуса"

  - name: settings
    label: Тексты сайта
    i18n: true
    files:
      - name: site
        label: Первый экран
        file: content/site.json
        format: json
        i18n: true
        fields:
          - name: alias
            label: Псевдоним
            widget: string
            i18n: duplicate
            hint: "Из него собирается слово из частиц и заголовок вкладки"
          - name: thesis
            label: Тезис
            widget: string
            i18n: true
            required: [ru]
          - name: intro
            label: Абзац под тезисом
            widget: text
            i18n: true
            required: [ru]
          - name: status
            label: Строка статуса
            widget: string
            i18n: true
            required: [ru]
            hint: "Угол первого экрана: формат работы, часовой пояс, занятость"
          - name: music
            label: Музыка
            widget: file
            i18n: duplicate
            required: false
            hint: "mp3, играет по кругу по переключателю звука. Пусто — звучит процедурный ветер мира. Ставить только трек, на который есть права"

      - name: skills
        label: Что делаю
        file: content/skills.json
        format: json
        i18n: true
        fields:
          - name: items
            label: Направления
            widget: list
            i18n: true
            required: [ru]
            fields:
              - { name: title, label: Название, widget: string, i18n: true }
              - { name: lead, label: Одна строка о пользе, widget: text, i18n: true }

      - name: contacts
        label: Контакты
        file: content/contacts.json
        format: json
        i18n: true
        fields:
          - { name: name, label: Имя, widget: string, i18n: true, required: [ru] }
          - name: note
            label: Строка над ссылками
            widget: text
            i18n: true
            required: false
            hint: "Необязательно: что писать и когда ответишь"
          - name: links
            label: Ссылки
            widget: list
            i18n: true
            required: [ru]
            fields:
              - { name: label, label: Подпись, widget: string, i18n: true }
              - { name: url, label: Адрес, widget: string, i18n: duplicate }
          - name: formUrl
            label: Адрес приёмника формы
            widget: string
            i18n: duplicate
            required: false
            hint: "Адрес воркера вида https://helias-contact.<аккаунт>.workers.dev. Пусто — формы на сайте нет, только ссылки"
