<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Знак: буква H брусками, а не текстом. Шрифт в SVG-значке подставляет
       система, и Cormorant там не окажется; бруски рисуются одинаково везде
       и не сливаются на 16 пикселях. Перекладина выше середины — так серифная
       H выглядит собранной, а не приземистой. -->
  <rect width="64" height="64" fill="#0a0908"/>
  <rect x="16" y="14" width="6" height="36" fill="#e8dfcd"/>
  <rect x="42" y="14" width="6" height="36" fill="#e8dfcd"/>
  <rect x="22" y="29" width="20" height="5" fill="#e8dfcd"/>
</svg>
